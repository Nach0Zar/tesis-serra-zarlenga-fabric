      CORE_PEER_CHAINCODEADDRESS: peer0.lab.snt.local:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.lab.snt.local:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.lab.snt.local:7051
      CORE_PEER_LOCALMSPID: LabMSP
    volumes:
