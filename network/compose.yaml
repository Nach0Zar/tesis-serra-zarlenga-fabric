name: snt-fabric

# Runtime topology for NET-3. Cryptographic material and CA configuration are
# generated by NET-1 under network/organizations/ and are intentionally not
# versioned. Channel creation and chaincode lifecycle belong to NET-4.

x-peer-environment: &peer-environment
  FABRIC_CFG_PATH: /etc/hyperledger/fabric
  FABRIC_LOGGING_SPEC: INFO
  CORE_LEDGER_STATE_STATEDATABASE: goleveldb
  CORE_LEDGER_HISTORY_ENABLEHISTORYDATABASE: "true"
  CORE_PEER_TLS_ENABLED: "true"
  CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
  CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
  CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
  CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
  CORE_PEER_PROFILE_ENABLED: "false"
  CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
  CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
  CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9443
  CORE_OPERATIONS_TLS_ENABLED: "false"
  CORE_METRICS_PROVIDER: disabled
  CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
  CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: snt-fabric-network
  # Applied to chaincode containers created dynamically by each peer. It keeps
  # the seven-container worst case inside the NET-3 WSL memory budget.
  CORE_VM_DOCKER_HOSTCONFIG_MEMORY: "201326592"
  CORE_VM_DOCKER_HOSTCONFIG_CPUPERIOD: "100000"
  CORE_VM_DOCKER_HOSTCONFIG_CPUQUOTA: "20000"
  CORE_CHAINCODE_EXECUTETIMEOUT: 300s

x-peer-service: &peer-service
  image: hyperledger/fabric-peer:${FABRIC_VERSION:-2.5.16}
  pull_policy: missing
  restart: unless-stopped
  command: peer node start
  working_dir: /root
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9443;
        printf "GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
        IFS= read -r status <&3;
        [[ "$$status" == "HTTP/1.1 200"* ]]'
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s
  deploy:
    resources:
      limits:
        cpus: "0.40"
        memory: 384M
  networks:
    - snt

x-orderer-environment: &orderer-environment
  FABRIC_LOGGING_SPEC: INFO
  ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
  ORDERER_GENERAL_LISTENPORT: "7050"
  ORDERER_GENERAL_BOOTSTRAPMETHOD: none
  ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
  ORDERER_GENERAL_TLS_ENABLED: "true"
  ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
  ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
  ORDERER_GENERAL_TLS_ROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
  ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
  ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
  ORDERER_GENERAL_CLUSTER_ROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
  ORDERER_ADMIN_TLS_ENABLED: "true"
  ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
  ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
  ORDERER_ADMIN_TLS_ROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
  ORDERER_ADMIN_TLS_CLIENTROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
  ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:7053
  ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:9443
  ORDERER_OPERATIONS_TLS_ENABLED: "false"
  ORDERER_METRICS_PROVIDER: disabled

x-orderer-service: &orderer-service
  image: hyperledger/fabric-orderer:${FABRIC_VERSION:-2.5.16}
  pull_policy: missing
  restart: unless-stopped
  command: orderer
  working_dir: /root
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9443;
        printf "GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
        IFS= read -r status <&3;
        [[ "$$status" == "HTTP/1.1 200"* ]]'
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s
  deploy:
    resources:
      limits:
        cpus: "0.25"
        memory: 192M
  networks:
    - snt

services:
  fabric-ca.snt.local:
    container_name: fabric-ca.snt.local
    image: hyperledger/fabric-ca:${FABRIC_CA_VERSION:-1.5.17}
    pull_policy: missing
    restart: unless-stopped
    environment:
      FABRIC_CA_HOME: /etc/hyperledger/fabric-ca-server/cas/anmat
      FABRIC_CA_SERVER_HOME: /etc/hyperledger/fabric-ca-server/cas/anmat
      FABRIC_CA_SERVER_PORT: "7054"
      FABRIC_CA_SERVER_TLS_ENABLED: "true"
      FABRIC_CA_SERVER_TLS_CERTFILE: /etc/hyperledger/fabric-ca-server/tls/server-tls-cert.pem
      FABRIC_CA_SERVER_TLS_KEYFILE: /etc/hyperledger/fabric-ca-server/tls/server-tls-key.pem
    command:
      - fabric-ca-server
      - start
      - --home
      - /etc/hyperledger/fabric-ca-server/cas/anmat
      - --port
      - "7054"
      - --tls.enabled
      - --tls.certfile
      - /etc/hyperledger/fabric-ca-server/tls/server-tls-cert.pem
      - --tls.keyfile
      - /etc/hyperledger/fabric-ca-server/tls/server-tls-key.pem
      - --loglevel
      - warning
      - --cafiles
      - /etc/hyperledger/fabric-ca-server/cas/lab/fabric-ca-server-config.yaml
      - --cafiles
      - /etc/hyperledger/fabric-ca-server/cas/drogueria/fabric-ca-server-config.yaml
      - --cafiles
      - /etc/hyperledger/fabric-ca-server/cas/distribuidor/fabric-ca-server-config.yaml
      - --cafiles
      - /etc/hyperledger/fabric-ca-server/cas/farmacia/fabric-ca-server-config.yaml
      - --cafiles
      - /etc/hyperledger/fabric-ca-server/cas/centromedico/fabric-ca-server-config.yaml
      - --cafiles
      - /etc/hyperledger/fabric-ca-server/cas/financiador/fabric-ca-server-config.yaml
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          for ca_name in ca-anmat ca-lab ca-drogueria ca-distribuidor ca-farmacia ca-centromedico ca-financiador; do
          fabric-ca-client getcainfo
          --home /tmp/fabric-ca-health
          --url https://127.0.0.1:7054
          --caname "$$ca_name"
          --tls.certfiles /etc/hyperledger/fabric-ca-server/tls/server-tls-cert.pem
          >/dev/null 2>&1 || exit 1;
          done
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 30s
    volumes:
      - type: bind
        source: ./organizations/.fabric-ca-server
        target: /etc/hyperledger/fabric-ca-server
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:7054:7054"
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 128M
    networks:
      - snt

  orderer.anmat.snt.local:
    <<: *orderer-service
    container_name: orderer.anmat.snt.local
    environment:
      <<: *orderer-environment
      ORDERER_GENERAL_LOCALMSPID: AnmatMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
    volumes:
      - type: bind
        source: ./organizations/anmat/orderers/orderer.anmat.snt.local/msp
        target: /var/hyperledger/orderer/msp
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./organizations/anmat/orderers/orderer.anmat.snt.local/tls
        target: /var/hyperledger/orderer/tls
        read_only: true
        bind:
          create_host_path: false
      - orderer-anmat-data:/var/hyperledger/production/orderer
    ports:
      - "127.0.0.1:7050:7050"
      - "127.0.0.1:7053:7053"
      - "127.0.0.1:9440:9443"

  orderer.lab.snt.local:
