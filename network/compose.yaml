      CORE_PEER_CHAINCODEADDRESS: peer0.drogueria.snt.local:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.drogueria.snt.local:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.drogueria.snt.local:7051
      CORE_PEER_LOCALMSPID: DrogueriaMSP
    volumes:
      - type: bind
        source: ./organizations/drogueria/peers/peer0.drogueria.snt.local/msp
        target: /etc/hyperledger/fabric/msp
        read_only: true
