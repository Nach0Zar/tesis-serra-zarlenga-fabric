        target: /etc/hyperledger/fabric/tls
        read_only: true
        bind:
          create_host_path: false
      - peer-anmat-data:/var/hyperledger/production
      - /var/run/docker.sock:/host/var/run/docker.sock
    ports:
      - "127.0.0.1:7051:7051"
      - "127.0.0.1:9444:9443"

  peer0.lab.snt.local:
    <<: *peer-service
    container_name: peer0.lab.snt.local
    environment:
