name: Client CI

on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "client/**"
      - "domain/**"
      # El contrato de metadatos y sus ejemplos viven fuera del modulo, pero los
      # valida `client/internal/runmeta`: sin esta ruta, editar el schema no
      # dispararia ninguna verificacion.
      - "benchmarks/schema/**"
      - "benchmarks/examples/**"
      # demo/demo.sh arranca el servidor de la demo de la defensa (DEMO-4).
      - "demo/**"
      - "scripts/coverage/**"
      - ".github/workflows/client-ci.yml"

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, lint and test client
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: client/go.mod
          cache: true
          cache-dependency-path: client/go.sum

      - name: Download and verify dependencies
        working-directory: client
        run: |
          go mod download
          go mod verify

      - name: Verify formatting
        working-directory: client
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          test -z "${unformatted}" || {
            printf 'Files need gofmt:\n%s\n' "${unformatted}" >&2
            exit 1
          }

      - name: Build
        working-directory: client
        run: go build -v ./...

      - name: Vet
        working-directory: client
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: client
          args: --timeout=5m

      - name: Test
        working-directory: client
        run: |
          go test -v -count=1 -race \
            -coverpkg=./internal/app/...,./internal/config/...,./internal/contracterr/...,./internal/runmeta/... \
            -coverprofile=coverage.out ./...

      # La logica del cliente debe mantener 85 % de cobertura. Quedan fuera el
      # adaptador gRPC de internal/fabric, que solo opera contra la red real,
      # y los main de cmd/.
      - name: Coverage gate
        working-directory: client
        run: ../scripts/coverage/check-go.sh coverage.out 85

      - name: Shellcheck demo script
        run: shellcheck demo/demo.sh

      - name: Set up Node.js for the demo rehearsal
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: demo/rehearsal/package-lock.json

      - name: Test rehearsal evidence checks
        working-directory: demo/rehearsal
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm ci
          npm test
