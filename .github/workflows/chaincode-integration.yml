name: Fabric Network Integration

on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "chaincode/**"
      - "domain/**"
      - "network/**"
      - "test/integration/**"
      - "test/fixtures/pdc-probe/**"
      - ".github/workflows/chaincode-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabric-network-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FABRIC_VERSION: "2.5.16"
  FABRIC_CA_VERSION: "1.5.17"
  SNT_CHANNEL_NAME: "snt-channel"

jobs:
  integration-test:
    name: snt-channel lifecycle and PDC
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: chaincode/go.mod
          cache: true
          cache-dependency-path: |
            chaincode/go.sum
            test/fixtures/pdc-probe/go.sum

      - name: Install Python validators
        run: python3 -m pip install --disable-pip-version-check jsonschema==4.25.1 PyYAML==6.0.2

      - name: Verify Docker
        run: |
          docker version
          docker compose version

      - name: Download Fabric binaries, samples and images
        shell: bash
        run: |
          set -Eeuo pipefail
          FABRIC_DIR="${RUNNER_TEMP}/fabric"
          mkdir -p "${FABRIC_DIR}"
          cd "${FABRIC_DIR}"
          curl --fail --silent --show-error --location --output install-fabric.sh "https://raw.githubusercontent.com/hyperledger/fabric/v${FABRIC_VERSION}/scripts/install-fabric.sh"
          chmod +x install-fabric.sh
          ./install-fabric.sh --fabric-version "${FABRIC_VERSION}" --ca-version "${FABRIC_CA_VERSION}" samples binary docker
          test -x fabric-samples/bin/peer
          test -x fabric-samples/bin/osnadmin
          test -x fabric-samples/bin/fabric-ca-server

      - name: Configure Fabric CLI
        shell: bash
        run: |
          echo "${RUNNER_TEMP}/fabric/fabric-samples/bin" >> "${GITHUB_PATH}"
          echo "SNT_FABRIC_BIN_DIR=${RUNNER_TEMP}/fabric/fabric-samples/bin" >> "${GITHUB_ENV}"
          echo "SNT_FABRIC_CFG_PATH=${RUNNER_TEMP}/fabric/fabric-samples/config" >> "${GITHUB_ENV}"

      - name: Validate generated inputs and scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 network/scripts/validate-organizations-manifest.py
          python3 network/scripts/generate-collections.py --check
          python3 -m unittest discover -s network/tests -v
          bash -n network/network.sh test/integration/pdc-evidence.sh
          shellcheck network/network.sh test/integration/pdc-evidence.sh

      - name: Generate cryptographic material
        shell: bash
        run: ./network/scripts/generate-crypto.sh

      - name: Start network and create channel
        shell: bash
        run: |
          ./network/network.sh up
          ./network/network.sh createChannel

      - name: Deploy snt and execute PDC evidence
        shell: bash
        run: |
          ./network/network.sh deployCC
          ./test/integration/pdc-evidence.sh
          jq -e '
            .schemaVersion == "1.0.0"
            and .channelId == "snt-channel"
            and .chaincodeName == "pdc-probe"
            and .assertions.collectionNameVisible == true
            and .assertions.privatePayloadIncluded == false
          ' build/evidence/net-5/sanitized-block-excerpt.json >/dev/null

      - name: Verify restart and idempotence
        shell: bash
        run: |
          ./network/network.sh restart
          ./network/network.sh createChannel
          ./network/network.sh deployCC
          ./network/network.sh verify

      - name: Show diagnostics on failure
        if: failure()
        shell: bash
        run: |
          docker ps --all || true
          while read -r container_id; do
            if [[ -n "${container_id}" ]]; then
              echo "----- ${container_id} -----"
              docker logs "${container_id}" || true
            fi
          done < <(docker ps --all --quiet)

      - name: Shut down Fabric network
        if: always()
        shell: bash
        run: ./network/network.sh down || true
